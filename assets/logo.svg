<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="0.55" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#BF5AF2"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E6FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1B0F5C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App-icon squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#shine)"/>

  <!-- Orbit: connected devices -->
  <circle cx="528" cy="520" r="350" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="10"/>
  <circle cx="775" cy="273" r="22" fill="#FFFFFF" fill-opacity="0.75"/>
  <circle cx="857" cy="640" r="15" fill="#FFFFFF" fill-opacity="0.55"/>
  <circle cx="353" cy="823" r="12" fill="#FFFFFF" fill-opacity="0.45"/>

  <g filter="url(#soft)">
    <!-- Terminal chevron -->
    <polyline points="230,392 370,530 230,668" fill="none" stroke="url(#glyph)" stroke-width="78"
              stroke-linecap="round" stroke-linejoin="round"/>

    <!-- "i" stem -->
    <rect x="512" y="470" width="96" height="290" rx="48" fill="url(#glyph)"/>

    <!-- Sparkle as the dot of the "i" (AI) -->
    <path d="M560 228
             C 571 300, 592 321, 664 332
             C 592 343, 571 364, 560 436
             C 549 364, 528 343, 456 332
             C 528 321, 549 300, 560 228 Z" fill="url(#glyph)"/>

    <!-- Cursor -->
    <rect x="660" y="712" width="132" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>
</svg>
